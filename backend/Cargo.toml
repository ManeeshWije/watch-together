[package]
name = "watch-together"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7.4", features = ["ws", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
futures-util = "0.3.30"
aws-config = { version= "1.5.4", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.4.0", features = ["rt-tokio"] }
anyhow = "1.0.86"
futures = "0.3.30"
tower-http = { version = "0.5.2", features = ["full"] }
axum-extra = { version = "0.9.0", features = ["cookie", "typed-header"] }
cookie = "0.18.0"
reqwest = { version = "0.11.22", features = ["json"] }
oauth2 = "4.1"
chrono = { version = "0.4.19", features = ["serde"] }
dotenv = "0.15.0"
sqlx = { version = "0.7.3", features = ["tls-native-tls", "runtime-tokio", "uuid", "postgres", "migrate", "time", "chrono"] }
uuid = { version = "1.7.0", features = ["v4", "serde"] }
http = "1.0.0"
rustube = "0.6.0"
